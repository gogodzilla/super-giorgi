<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Супер Гиорги">
<meta name="theme-color" content="#10141c">
<link rel="manifest" href="manifest.webmanifest">
<title>Супер Гиорги: Батуми</title>
<style>
  html, body { margin: 0; height: 100%; background: #10141c; overflow: hidden; touch-action: none; }
  body { display: flex; align-items: center; justify-content: center; box-sizing: border-box; }
  canvas { display: block; image-rendering: pixelated; }
  #touch {
    position: fixed; left: 0; right: 0; bottom: 0; display: none; justify-content: space-between; align-items: flex-end;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); pointer-events: none;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  #touch .grp { display: flex; gap: 12px; pointer-events: auto; }
  #touch button {
    /* pixel-art faces drawn by game.js (--img / --img-on); the text is kept for screen readers only */
    width: 68px; height: 68px; padding: 0; border: 0; border-radius: 0; color: transparent; font-size: 0;
    background: var(--img) center / 100% 100% no-repeat; image-rendering: pixelated; touch-action: none;
    -webkit-tap-highlight-color: transparent;
  }
  #touch button:active, #touch button.on { background-image: var(--img-on); }
  #touch .mid button { width: 44px; height: 44px; }
  #touch .mid button.off { opacity: .4; }
  body.touch #touch { display: flex; }
  /* Phone held upright: HUD strip and world on top (sized in resize()), a gamepad panel filling the rest. */
  body.phone { align-items: flex-start; padding-top: env(safe-area-inset-top); }
  body.touch.phone #touch {
    --b: min(84px, calc((100vw - 64px) / 4));
    display: grid; grid-template-columns: auto 1fr auto; align-content: center; row-gap: 10px;
    top: calc(env(safe-area-inset-top) + var(--game-h, 0px)); padding: 10px 16px calc(12px + env(safe-area-inset-bottom));
    background: #181d29; border-top: 3px solid #2a3246; box-sizing: border-box;
  }
  body.phone #touch button { width: var(--b); height: var(--b); }
  body.phone #touch .mid { grid-column: 1; grid-row: 1; gap: 10px; }
  body.phone #touch .mid button { width: 40px; height: 40px; }
  body.phone #touch .dpad { grid-column: 1; grid-row: 2; }
  body.phone #touch .act { grid-column: 3; grid-row: 2; align-self: end; }
  /* Held sideways: the world in the middle (sized in resize()), ◀ ▶ in a panel on the left with pause/sound/fullscreen
     above them, БЕГ ▲ on the right, so no button covers the street. */
  body.touch.land #touch { top: 0; display: block; padding: 0; }
  body.land #touch .grp { position: absolute; gap: 10px; }
  body.land #touch button { width: var(--b); height: var(--b); }
  body.land #touch .dpad { left: calc(12px + env(safe-area-inset-left)); bottom: calc(14px + env(safe-area-inset-bottom)); }
  body.land #touch .act { right: calc(12px + env(safe-area-inset-right)); bottom: calc(14px + env(safe-area-inset-bottom)); }
  body.land #touch .mid { left: calc(12px + env(safe-area-inset-left)); top: calc(12px + env(safe-area-inset-top)); gap: 6px; }
  body.land #touch .mid button { width: 36px; height: 36px; }
</style>
</head>
<body>
<canvas id="game" aria-label="Игра «Супер Гиорги: Батуми»"></canvas>
<div id="touch">
  <div class="grp dpad"><button data-dir="left" aria-label="Влево">◀</button><button data-dir="right" aria-label="Вправо">▶</button></div>
  <div class="grp mid"><button data-act="pause" aria-label="Пауза">II</button><button data-act="mute" aria-label="Звук">♪</button><button id="fs" aria-label="Во весь экран">⛶</button></div>
  <div class="grp act"><button data-act="run" class="word" aria-label="Бег">БЕГ</button><button data-act="jump" class="jump" aria-label="Прыжок">▲</button></div>
</div>
<script src="game.js"></script>
</body>
</html>
